[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ro-agent"
version = "0.1.0"
description = "Natural-language robot task service with verifiable execution facts"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.143.0", "pydantic==2.14.1", "uvicorn==0.54.0",
    "asyncpg==0.32.0", "httpx==0.28.1",
    "websockets==17.2",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.17.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: requires isolated PostgreSQL", "acceptance: requires explicit live authorization"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
